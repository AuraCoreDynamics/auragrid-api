[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auragrid-api"
version = "4.3.0"
description = "Canonical wire contracts, JSON Schemas, OpenAPI 3.1 specifications, protocol docs, and golden test vectors for the AuraCore ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["auragrid_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
